<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LangGraph Workflow Chatbot</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        /* Basic reset and styling */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Chat container styling */
        .chat-container {
            flex: 2;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background-color: #fff;
        }

        .chat-window {
            flex: 1;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            background-color: #fafafa;
        }

        .chat-input {
            display: flex;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .chat-input button {
            padding: 10px 20px;
            margin-left: 10px;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        /* JSON display container styling */
        .json-container {
            flex: 1;
            border-left: 1px solid #ccc;
            padding: 20px;
            background-color: #fafafa;
            overflow-y: auto;
        }

        .json-container h2 {
            margin-top: 0;
        }

        /* JSON tree styling */
        .json-tree ul {
            list-style-type: none;
            padding-left: 20px;
            margin: 4px 0;
        }

        .json-tree li {
            margin: 4px 0;
            line-height: 1.4;
        }

        .json-key {
            font-weight: bold;
            color: #333;
        }

        .json-value {
            color: #0077cc;
        }
    </style>


</head>

<body>
    <div class="container">
        <!-- Chat Section -->
        <div class="chat-container">
            <div class="chat-window" id="chat-window">
                <!-- Chat messages will appear here -->
            </div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Type your message..." />
                <button id="send-button">Send</button>
            </div>
        </div>
        <!-- JSON Data Section -->
        <div class="json-container">
            <h2>Data</h2>
            <div id="json-display" class="json-tree"></div>
        </div>
    </div>

    <script>
        const sio = io("/ws");
        let sessionID = null; // Store the unique session ID

        sio.on('connect', () => {
            console.log('Connected to server');
        });

        sio.on('disconnect', () => {
            console.log('Disconnected from server');
        });

        sio.on('sid', (sid) => {
            console.log('Session ID:', sid);
            sessionID = sid; // Save the session ID for future requests
            start_workflow(); // Start the workflow once session is established
        });

        sio.on('reply', (message) => {
            console.log('Bot replied:', message);
            addMessage('Bot', message);
        });

        sio.on('state_json', (data) => {
            console.log('Received JSON data:', data);
            displayJsonData(data);
        });

        function start_workflow() {
            if (sessionID) {
                sio.emit('start_workflow', sessionID); // Send workflow request with session ID
                console.log('Workflow started for session:', sessionID);
            } else {
                console.log("Session ID not set. Can't start workflow.");
            }
        }

        // Recursive function to generate a nested HTML tree from JSON data.
        function generateHTML(obj) {
            let html = '<ul>';
            for (let key in obj) {
                if (obj.hasOwnProperty(key)) {
                    if (typeof obj[key] === 'object' && obj[key] !== null) {
                        html += '<li><span class="json-key">' + key + ':</span>' + generateHTML(obj[key]) + '</li>';
                    } else {
                        let value = (obj[key] === null) ? 'null' : obj[key];
                        html += '<li><span class="json-key">' + key + ':</span> <span class="json-value">' + value + '</span></li>';
                    }
                }
            }
            html += '</ul>';
            return html;
        }

        function displayJsonData(data) {
            const htmlContent = generateHTML(data);
            document.getElementById('json-display').innerHTML = htmlContent;
        }

        const sendButton = document.getElementById('send-button');
        const userInput = document.getElementById('user-input');
        const chatWindow = document.getElementById('chat-window');

        function addMessage(sender, message) {
            const messageDiv = document.createElement('div');
            messageDiv.textContent = sender + ": " + message;
            messageDiv.style.marginBottom = "10px";
            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        sendButton.addEventListener('click', function () {
            const message = userInput.value.trim();
            if (message !== "" && sessionID) {
                addMessage("You", message);
                sio.emit('message', sessionID, message); // Send message with session ID
                console.log('Message sent to server:', message);
                userInput.value = "";
            }
        });

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendButton.click();
            }
        });
    </script>
</body>

</html>
