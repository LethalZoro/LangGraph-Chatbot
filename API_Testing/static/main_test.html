<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LangGraph Workflow Chatbot</title>
    <style>
        /* Basic reset and styling */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Chat container styling */
        .chat-container {
            flex: 2;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background-color: #fff;
        }

        .chat-window {
            flex: 1;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            background-color: #fafafa;
        }

        .chat-input {
            display: flex;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .chat-input button {
            padding: 10px 20px;
            margin-left: 10px;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        /* JSON display container styling */
        .json-container {
            flex: 1;
            border-left: 1px solid #ccc;
            padding: 20px;
            background-color: #fafafa;
            overflow-y: auto;
        }

        .json-container h2 {
            margin-top: 0;
        }

        /* JSON tree styling */
        .json-tree ul {
            list-style-type: none;
            padding-left: 20px;
            margin: 4px 0;
        }

        .json-tree li {
            margin: 4px 0;
            line-height: 1.4;
        }

        .json-key {
            font-weight: bold;
            color: #333;
        }

        .json-value {
            color: #0077cc;
        }
    </style>
    <script>
        // Initialize variables

        let sessionID = null;

        var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        var wsUrl = `${protocol}//${window.location.host}/fastapi-ws`;
        var ws = new WebSocket(wsUrl);



        ws.onopen = function () {
            console.log('WebSocket connected');
            // startWorkflow();
            console.log('Session ID:', sessionID);
            // console.log('Connecting to WebSocket:', wsUrl);
            console.log('Connecting to WebSocket:', ws);

        };

        ws.onmessage = function (event) {
            console.log('WebSocket message received:', event.data);
            try {
                const data = JSON.parse(event.data);
                switch (data.type) {
                    case "connection":
                        sessionID = data.sid;
                        startWorkflow();
                        break;
                    case "reply":
                        addMessage("Bot", data.content);
                        break;
                    case "state_json":
                        displayJsonData(data.content);
                        break;
                }
            } catch (e) {
                // Handle non-JSON messages
                console.log("Raw message:", event.data);
            }
        };



        function startWorkflow() {
            if (!sessionID) {
                console.log("Session ID not set. Can't start workflow.");
                return;
            }

            console.log('Starting workflow for session:', sessionID);

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "message",
                    content: "start_workflow",
                    sid: sessionID  // Use the sessionID received during connection
                }));
                console.log('Workflow started');
            }
        }

        // Recursive function to generate a nested HTML tree from JSON data
        function generateHTML(obj) {
            let html = '<ul>';
            for (let key in obj) {
                if (obj.hasOwnProperty(key)) {
                    if (typeof obj[key] === 'object' && obj[key] !== null) {
                        html += '<li><span class="json-key">' + key + ':</span>' + generateHTML(obj[key]) + '</li>';
                    } else {
                        let value = (obj[key] === null) ? 'null' : obj[key];
                        html += '<li><span class="json-key">' + key + ':</span> <span class="json-value">' + value + '</span></li>';
                    }
                }
            }
            html += '</ul>';
            return html;
        }

        function displayJsonData(data) {
            const htmlContent = generateHTML(data);
            document.getElementById('json-display').innerHTML = htmlContent;
        }

        const sendButton = document.getElementById('send-button');
        const userInput = document.getElementById('user-input');
        const chatWindow = document.getElementById('chat-window');

        function addMessage(sender, message) {
            const messageDiv = document.createElement('div');
            const chatWindow = document.getElementById('chat-window');
            messageDiv.textContent = sender + ": " + message;
            messageDiv.style.marginBottom = "10px";
            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function sendMessage() {
            const messageInput = document.getElementById('user-input');
            const message = messageInput.value.trim();
            if (message === "") {
                console.log('Message NOT sent to server:', ws);
                console.log('Message NOT sent to server:', message);
                messageInput.value = ''; // Clear the input field
                return;
            }
            // console.log('Message my:', message);
            addMessage("You", message);

            if (message) {
                ws.send(JSON.stringify({
                    type: "message",
                    content: message,
                    sid: sessionID  // Use the sessionID received during connection
                }));
                console.log('Message sent to server:', message);
                messageInput.value = ''; // Clear the input field
            }
            else {
                console.error('WebSocket not connected');
            }

        };


    </script>


</head>

<body>
    <div class="container">
        <!-- Chat Section -->
        <div class="chat-container">
            <div class="chat-window" id="chat-window">
                <!-- Chat messages will appear here -->
            </div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Type your message..."
                    onkeypress="if(event.keyCode == 13) sendMessage()">
                <button onclick=" sendMessage()">Send</button>
            </div>
        </div>
        <!-- JSON Data Section -->
        <div class="json-container">
            <h2>Data</h2>
            <div id="json-display" class="json-tree"></div>
        </div>
    </div>


</body>

</html>
